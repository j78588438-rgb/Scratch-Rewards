<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUKJ8V3q8VtDJI6STl7r69HNmt-xyLZUg",
  authDomain: "scratch-rewards-949ac.firebaseapp.com",
  projectId: "scratch-rewards-949ac",
  storageBucket: "scratch-rewards-949ac.firebasestorage.app",
  messagingSenderId: "210634759910",
  appId: "1:210634759910:web:62558c949d8b54f5926527",
  measurementId: "G-MMJM2YHM8S"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById("googleLogin").addEventListener("click", async function() {
  const status = document.getElementById("loginStatus");

  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);
    const idToken = await result.user.getIdToken();

    const response = await fetch(
      "https://scratch-rewards-api.j78588438.workers.dev/me",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + idToken,
          "Content-Type": "application/json"
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "No se pudo conectar la cuenta");
    }

    status.textContent =
      "Bienvenido, " + result.user.displayName +
      ". Puntos acumulados: " + data.user.points;

  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
});
</script>
